          "@type": "Answer",

        }
      },

        "@type": "Question",

          "@type": "Answer",
          "text": "紧张是正常的，首先要接受它。可以通过大量练习形成肌肉记忆，同时做好心理建设：去的目的是积累经验，而不是必须上岸。"
        }
      },
      {
        "@type": "Question",
        "name": "面试答题没思路怎么办？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "用布点法：一道题目上手，要先找到一条可行的逻辑主线，在主线上布2-3个要点，每个要点再展开成2-3个小点，这样一个题目就很丰富了。"
        }
      },

        "@type": "Question",

        "acceptedAnswer": {
          "@type": "Answer",
          "text": "最快的积累方法是不断答题并复盘，通过真实题目来累积常见的分析思路。比如老龄化社会加速到来这个观点是宏观社会视角，在很多题目中都可以复用。"
        }
      },
      {
        "@type": "Question",
        "name": "面试复盘应该怎么做？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "复盘要复三个问题：思路对不对？亮点在哪里？问题在哪里？初期浅复盘，3-5分钟重新列提纲即可；后期深复盘，优化思路、总结框架、创新亮点。"
        }
      },
      {
        "@type": "Question",
        "name": "面试答题同质化严重怎么办？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "避免同质化需要创新：一是具体问题加入宏观视角，做到虚实结合；二是多用自己生活中的例子；三是形成自己独特的分析角度。"

        "@type": "Question",

<body>
  <div id="app">
    <div class="lrj-boot">
      <b></b>
      <p>一个路人甲 · 结构化面试</p>
      <span>正在加载内容</span>
    </div>
  </div>
  <script>
    // 旧 hash 链接兼容：#/guide/xxx(.md) → /guide/xxx
    (function () {
      var h = window.location.hash;
      if (h && h.indexOf('#/') === 0) {
        var target = h.slice(1).replace(/\.md(?=$|\?)/, '');
        window.history.replaceState(null, '', target);
      }
    })();
  </script>
  <script>
    window.$docsify = {
      name: '一个路人甲',
      repo: '',
      routerMode: 'history',
      loadSidebar: '_sidebar.md',
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      subMaxLevel: 3,
      auto2top: true,
      coverpage: '_coverpage.md',
      search: {
        maxAge: 86400000,
        paths: 'auto'
      },
      plugins: [
        function (hook, vm) {
          hook.doneEach(function () {
            var path = vm.route.path;
            // /README 与 / 渲染同一份内容，按首页处理（避免重复收录与标题重复）
            var isHome = !path || path === '/' || path === '/README';

            // 图片点击放大（只绑定一次）
            if (!window.__lrjZoomBound) {
              window.__lrjZoomBound = true;
              document.addEventListener('click', function (e) {
                var img = e.target && e.target.closest ? e.target.closest('.markdown-section img') : null;
                if (!img || img.closest('.lrj-footer-cta')) return;
                var box = document.getElementById('lrj-lightbox');
                if (!box) {
                  box = document.createElement('div');
                  box.id = 'lrj-lightbox';
                  box.innerHTML = '<img alt=""><div class="lrj-lb-hint">点击任意处或按 Esc 关闭</div>';
                  document.body.appendChild(box);
                  box.addEventListener('click', function () {
                    box.classList.remove('active');
                    document.body.style.overflow = '';
                  });
                }
                var big = box.querySelector('img');
                big.src = img.currentSrc || img.src;
                big.alt = img.alt || '';
                box.classList.add('active');
                document.body.style.overflow = 'hidden';
              });
              document.addEventListener('keydown', function (e) {
                if (e.key !== 'Escape') return;
                var box = document.getElementById('lrj-lightbox');
                if (box && box.classList.contains('active')) {
                  box.classList.remove('active');
                  document.body.style.overflow = '';
                }
              });
            }

            // 转化事件埋点：GA4 + 百度统计双发（只绑定一次）
            if (!window.__lrjTrackBound) {
              window.__lrjTrackBound = true;
              window.lrjTrack = function (name, params) {
                try {
                  if (typeof gtag === 'function') gtag('event', name, params || {});
                  if (window._hmt) window._hmt.push(['_trackEvent', 'convert', name, location.pathname]);
                } catch (err) { /* 统计失败不影响页面 */ }
              };
              document.addEventListener('click', function (e) {
                var el = e.target && e.target.closest ? e.target.closest('[data-lrj-event], a') : null;
                if (!el) return;
                var ev = el.getAttribute('data-lrj-event');
                if (!ev && el.tagName === 'A') {
                  var href = el.getAttribute('href') || '';
                  if (href.indexOf('/guide/resources') === 0 || href.indexOf('./guide/resources') === 0) {
                    ev = 'click_cta_resources';
                  } else if (href.indexOf('xhslink') !== -1) {
                    ev = 'click_buy_xhs';
                  }
                }
                if (!ev) return;
                window.lrjTrack(ev, {
                  link_text: (el.textContent || '').trim().slice(0, 40),
                  page_path: location.pathname
                });
              });

              // 一键复制口令（同步 execCommand 优先，兼容微信内置浏览器；再退到 Clipboard API）
              document.addEventListener('click', function (e) {
                var btn = e.target && e.target.closest ? e.target.closest('[data-lrj-copy]') : null;
                if (!btn) return;
                e.preventDefault();
                var text = btn.getAttribute('data-lrj-copy') || '';
                var label = btn.textContent;
                var settle = function (ok) {
                  btn.textContent = ok ? '已复制，去小红书粘贴' : '复制失败，请长按选中';
                  btn.classList.add(ok ? 'is-ok' : 'is-fail');
                  setTimeout(function () {
                    btn.textContent = label;
                    btn.classList.remove('is-ok', 'is-fail');
                  }, 2600);
                  if (ok) window.lrjTrack('click_copy_xhs', { page_path: location.pathname });
                };
                var syncCopy = function () {
                  try {
                    var ta = document.createElement('textarea');
                    ta.value = text;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.left = '-9999px';
                    ta.style.top = '0';
                    document.body.appendChild(ta);
                    ta.focus();
                    ta.select();
                    ta.setSelectionRange(0, text.length);
                    var ok = document.execCommand('copy');
                    document.body.removeChild(ta);
                    return ok;
                  } catch (err) {
                    return false;
                  }
                };
                if (syncCopy()) {
                  settle(true);
                } else if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(text).then(function () { settle(true); }, function () { settle(false); });
                } else {
                  settle(false);
                }
              });
            }

            // 每页更新 canonical（去掉 .md 与尾部斜杠）
            var canonical = document.querySelector('link[rel="canonical"]');
            if (canonical) {
              var clean = isHome ? '/' : path.replace(/\.md$/, '').replace(/\/$/, '');
              canonical.setAttribute('href', 'https://yigelurenjia.com' + clean);
            }

            // 每页更新标题
            var h1 = document.querySelector('.markdown-section h1');
            document.title = (h1 && !isHome)
              ? h1.textContent.trim() + ' | 一个路人甲 · 结构化面试'
              : '一个路人甲 · 结构化面试原创学习体系 | 免费自学资料';

            // SPA 路由切换时补发 page_view（GA4 + 百度统计；首次加载已由各自脚本自动上报）
            var gaPath = isHome ? '/' : path.replace(/\.md$/, '');
            if (window.__lrjLastGaPath !== gaPath) {
              window.__lrjLastGaPath = gaPath;
              if (typeof gtag === 'function') {
                gtag('event', 'page_view', {
                  page_title: document.title,
                  page_path: gaPath,
                  page_location: location.origin + gaPath
                });
              }
              if (window._hmt) {
                window._hmt.push(['_setAutoPageview', false]);
                window._hmt.push(['_trackPageview', gaPath]);
              }
            }

            // 承接页本身不再注入文末块（首页正文需要，封面浮层不影响）
            if (path.indexOf('resources') !== -1) return;
            var main = document.querySelector('.markdown-section');
            if (!main || main.querySelector('.lrj-footer-cta')) return;
            var box = document.createElement('div');
            box.className = 'lrj-footer-cta';
            box.innerHTML =
              '<img src="/assets/img/logo.png" alt="一个路人甲">' +
              '<div class="lrj-cta-text">' +
              '<p class="lrj-cta-title">配套资料与视频课</p>' +
              '<p class="lrj-cta-sub">思维总结 · 答题示例 · 视频课，网站内容之外更系统的整理</p>' +
              '</div>' +
              '<a class="lrj-cta-link" href="/guide/resources">查看</a>';
            main.appendChild(box);
          });
        }
      ]
    }
