              document.addEventListener('keydown', function (e) {
                if (e.key !== 'Escape') return;
                var box = document.getElementById('lrj-lightbox');
                if (box && box.classList.contains('active')) {
                  box.classList.remove('active');
                  document.body.style.overflow = '';
                }
              });
            }

            // 每页更新 canonical（去掉 .md 与尾部斜杠）
            var canonical = document.querySelector('link[rel="canonical"]');
            if (canonical) {
              var clean = isHome ? '/' : path.replace(/\.md$/, '').replace(/\/$/, '');
              canonical.setAttribute('href', 'https://yigelurenjia.com' + clean);
            }

            // 每页更新标题
            var h1 = document.querySelector('.markdown-section h1');
            document.title = (h1 && !isHome)
              ? h1.textContent.trim() + ' | 一个路人甲 · 结构化面试'
              : '一个路人甲 · 结构化面试原创学习体系 | 免费自学资料';

            // 承接页本身不再注入文末块（首页正文需要，封面浮层不影响）
            if (path.indexOf('resources') !== -1) return;
            var main = document.querySelector('.markdown-section');
            if (!main || main.querySelector('.lrj-footer-cta')) return;
            var box = document.createElement('div');
            box.className = 'lrj-footer-cta';
            box.innerHTML =
              '<img src="/assets/img/logo.png" alt="一个路人甲">' +
              '<div class="lrj-cta-text">' +
              '<p class="lrj-cta-title">配套资料与视频课</p>' +
              '<p class="lrj-cta-sub">思维总结 · 答题示例 · 视频课，网站内容之外更系统的整理</p>' +
              '</div>' +
              '<a class="lrj-cta-link" href="/guide/resources">查看</a>';
            main.appendChild(box);
          });
        }
      ]
    }
  </script>
  <script src="/assets/docsify.js"></script>
  <script src="/assets/search.min.js"></script>
</body>
</html>
