          "text": "建议采用游击战法：先用2-3小时了解基本题型思路，然后直接开始大量练习，边打边学，不要在一道题上纠结太久。"

        "name": "面试答题展不开怎么办？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "掌握观点展开法：学会对每个观点进行广度拓展和深度挖掘。广度法是分解为具体组成部分，深度法是不断追问为什么和怎么办。"
        }
      },

        "@type": "Question",
        "name": "面试紧张怎么缓解？",
        "acceptedAnswer": {
          "@type": "Answer",

        }
      },
      {
        "@type": "Question",
        "name": "面试答题没思路怎么办？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "用布点法：一道题目上手，要先找到一条可行的逻辑主线，在主线上布2-3个要点，每个要点再展开成2-3个小点，这样一个题目就很丰富了。"
        }
      },
      {
        "@type": "Question",
        "name": "面试对策展不开怎么说？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "可以用布点法解决：先找到逻辑主线，然后布置2-3个要点，每个要点再展开成2-3个小点。例如政府借助抖音开展政务工作，可以将逻辑主线设定为了解现状-优化内容-效果评估。"
        }
      },
      {
        "@type": "Question",
        "name": "面试答题怎么积累思路？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "最快的积累方法是不断答题并复盘，通过真实题目来累积常见的分析思路。比如老龄化社会加速到来这个观点是宏观社会视角，在很多题目中都可以复用。"
        }
      },
      {
        "@type": "Question",
        "name": "面试口语词多怎么解决？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "三个方法：一是接受停顿，不需要用嗯啊填充空白；二是放慢语速，给自己更多思考空间；三是记录答题情况，每次尝试比上一次减少。"
        }
      },
      {
        "@type": "Question",
        "name": "面试复盘应该怎么做？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "复盘要复三个问题：思路对不对？亮点在哪里？问题在哪里？初期浅复盘，3-5分钟重新列提纲即可；后期深复盘，优化思路、总结框架、创新亮点。"
        }
      },
      {
        "@type": "Question",
        "name": "面试答题同质化严重怎么办？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "避免同质化需要创新：一是具体问题加入宏观视角，做到虚实结合；二是多用自己生活中的例子；三是形成自己独特的分析角度。"
        }
      },
      {
        "@type": "Question",
        "name": "面试失败太多次怎么办？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "一条河流在向大海挺进的过程中，难免遇到一些逆流，但这并不能阻挡它继续前进。面试不外乎解决两件事：想清楚和说清楚。找不到思路就多复盘答题思路，答题不流畅就多开口练习。"
        }
      }
